repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
# - repo: https://github.com/asottile/pyupgrade
#   rev: v2.29.0
#   hooks:
#     - id: pyupgrade
#       args: [--py37-plus]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.7
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format
